name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,ui,embeddings]"

      - name: Lint (ruff)
        run: ruff check trazo tests
        continue-on-error: true
        env:
          PYTHONPATH: .

      - name: Format check (ruff)
        run: ruff format --check trazo tests
        continue-on-error: true
        env:
          PYTHONPATH: .

      - name: Type check (mypy)
        run: mypy trazo --ignore-missing-imports
        continue-on-error: true
        env:
          PYTHONPATH: .

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=trazo --cov-report=xml
        continue-on-error: true
        env:
          PYTHONPATH: .

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # Run the demo example to ensure it works end-to-end
  demo:
    name: Demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python examples/mock_chain.py
