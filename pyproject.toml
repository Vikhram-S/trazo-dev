[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trazo"
version = "0.1.0"
description = "Zero-dependency execution tracer and semantic diff engine for LLM agent pipelines"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Trazo Contributors", email = "hello@trazo-dev.dev" },
]
keywords = [
  "llm", "tracing", "observability", "ai-agents", "debugging",
  "openai", "anthropic", "langchain", "semantic-diff",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies — kept minimal on purpose
dependencies = [
  "pydantic>=2.0",
  "click>=8.1",
  "rich>=13.0",
]

[project.optional-dependencies]
# Full web UI
ui = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]
# Real semantic embeddings (optional upgrade path)
embeddings = [
  "sentence-transformers>=2.7",
]
# Development tooling
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
  "pre-commit>=3.7",
  "hatch",
  "ollama",
]

[project.scripts]
trazo = "trazo.cli.main:main"

[project.urls]
Homepage    = "https://github.com/trazo-dev/trazo"
Repository  = "https://github.com/trazo-dev/trazo"
Issues      = "https://github.com/trazo-dev/trazo/issues"
Changelog   = "https://github.com/trazo-dev/trazo/blob/main/CHANGELOG.md"

# ── Hatch ────────────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["trazo"]

[tool.hatch.envs.default]
features = ["dev", "ui"]

[tool.hatch.envs.default.scripts]
test    = "pytest tests/ -v --tb=short"
cov     = "pytest tests/ --cov=trazo --cov-report=term-missing --cov-report=html"
lint    = "ruff check trazo tests"
fmt     = "ruff format trazo tests"
typecheck = "mypy trazo --ignore-missing-imports"
demo    = "python examples/ollama_agent.py"

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "T20", "RUF"]
ignore = [
  "ANN101", "ANN102", "ANN401",  # self/cls annotations
  "S101",                         # assert in tests
  "T201",                         # print in examples
  "B008",                         # default arg in function call
]
per-file-ignores = { "tests/*" = ["ANN", "S"], "examples/*" = ["ANN", "S", "T201"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["trazo"]
omit = ["trazo/ui/*", "tests/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
