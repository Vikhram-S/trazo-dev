[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trazo"
version = "0.1.2"
description = "Universal execution tracer and semantic diff engine for LLM agent pipelines"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Vikhram S", email = "vikhrams@saveetha.ac.in" },
]
maintainers = [
  { name = "Vikhram S", email = "vikhrams@saveetha.ac.in" },
]
keywords = [
  "llm", "tracing", "observability", "ai-agents", "debugging",
  "openai", "anthropic", "langchain", "semantic-diff", "local-first",
  "agent-ops", "instrumentation", "ollama", "sqlite",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

dependencies = [
  "pydantic>=2.0.0",
  "click>=8.1.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
ui = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
]
embeddings = [
  "sentence-transformers>=2.7.0",
  "numpy>=1.24.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "mypy>=1.9.0",
  "pre-commit>=3.7.0",
  "hatch>=1.9.0",
  "ollama>=0.1.0",
  "openai>=1.12.0",
]

[project.scripts]
trazo = "trazo.cli.main:main"

[project.urls]
Homepage = "https://github.com/Vikhram-S/trazo-dev"
Documentation = "https://github.com/Vikhram-S/trazo-dev#readme"
Repository = "https://github.com/Vikhram-S/trazo-dev.git"
Issues = "https://github.com/Vikhram-S/trazo-dev/issues"
Changelog = "https://github.com/Vikhram-S/trazo-dev/blob/main/CHANGELOG.md"

# ── Hatch ────────────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["trazo"]

[tool.hatch.envs.default]
features = ["dev", "ui"]

[tool.hatch.envs.default.scripts]
test = "pytest tests/ -v --tb=short"
cov = "pytest tests/ --cov=trazo --cov-report=term-missing --cov-report=html"
lint = "ruff check trazo tests"
fmt = "ruff format trazo tests"
typecheck = "mypy trazo --ignore-missing-imports"
demo = "python examples/mock_chain.py"

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "ANN",  # flake8-annotations
  "S",    # flake8-bandit
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "T20",  # flake8-print
  "RUF",  # ruff-specific rules
  "SIM",  # flake8-simplify
  "ARG",  # flake8-unused-arguments
  "PT",   # flake8-pytest-style
]
ignore = [
  "ANN101", # self type
  "ANN102", # cls type
  "ANN401", # Any type
  "S101",   # use of assert
  "T201",   # print in examples/cli
  "B008",   # default arg in function call
  "ARG001", # unused function argument
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "ARG"]
"examples/*" = ["ANN", "S", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["trazo"]
omit = ["trazo/ui/*", "tests/*", "examples/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
